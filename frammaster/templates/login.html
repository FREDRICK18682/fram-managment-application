{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>
<body>
<form class="max-w-sm mx-auto" method="POST">
  
  {% csrf_token %}

<div class="mb-5">
    <label for="email" class="block mb-2 text-sm font-medium text-gray-900">Your email</label>
    <input type="email" id="email" name="email" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 placeholder-gray-400 shadow-sm" placeholder="name@flowbite.com" required />
  </div>

  <div class="mb-5">
    <label for="password" class="block mb-2 text-sm font-medium text-gray-900">Your password</label>
    <input type="password" id="password" name="password" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 placeholder-gray-400 shadow-sm" placeholder="••••••••" required />
  </div>

  <div class="flex items-center mb-5">
  
    <input id="remember" name="remember" type="checkbox" class="w-4 h-4 border border-gray-300 rounded bg-gray-50 focus:ring-3 focus:ring-blue-300" />
    <label for="remember" class="ms-2 text-sm font-medium text-gray-900 select-none">
      I agree with the <a href="#" class="text-blue-600 hover:underline">terms and conditions</a>.
    </label>
  </div>

  <button type="submit" 
  class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm w-full sm:w-auto px-5 py-2.5 text-center shadow-sm">
  Submit</button>

  <div class="mt-4 text-sm text-gray-600">
    Don't have an account? <a href="{% url 'signup' %}" class="text-blue-600 hover:underline font-medium">Create one here</a>
  </div>
</form>
</body>
</html>
